<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <!-- 24-Hour Anti-Spam Unique Device View Counter -->
    <script>
    (async function initViewCounter() {
        const slug = window.location.pathname.split('/').pop().replace('.html', '') || 'blog-post';
        const el = document.getElementById('viewCount');
        if (!el) return;
        
        const lockKey = 'tmd_view_lock_' + slug;
        const cacheKey = 'tmd_view_count_' + slug;
        const lastVisit = localStorage.getItem(lockKey);
        const cachedCount = localStorage.getItem(cacheKey);
        const now = Date.now();
        const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;
        
        // Always display cached count immediately
        if (cachedCount) {
            el.textContent = cachedCount;
        }
        
        // Prevent refresh spam: If visited in last 24 hours, do NOT increment API
        if (lastVisit && (now - parseInt(lastVisit, 10)) < TWENTY_FOUR_HOURS) {
            return;
        }
        
        try {
            const apiKey = 'tmd_blog_' + slug.replace(/[^a-zA-Z0-9_-]/g, '_');
            const res = await fetch('https://api.visitorbadge.io/api/visitors?path=' + apiKey, { cache: 'no-cache' });
            if (res.ok) {
                const text = await res.text();
                const match = text.match(/aria-label="VISITORS:\s*([0-9,kM\.\+]+)"/i) || text.match(/>([0-9,kM\.\+]+)</);
                if (match && match[1]) {
                    const count = match[1];
                    el.textContent = count;
                    localStorage.setItem(cacheKey, count);
                    localStorage.setItem(lockKey, now.toString());
                }
            }
        } catch (e) {
            if (!cachedCount) el.textContent = '1';
        }
    })();
    </script>
